name: Build mod (NeoForge)

on:
  push:
    branches: [ "main", "master", "1.21", "1.21.x", "1.21.1" ]
  pull_request:
    branches: [ "main", "master", "1.21", "1.21.x", "1.21.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 必要时可缓存 .gradle
      - name: Build with Gradle
        run: ./gradlew -b build_neoforge.gradle build

      # 上传构建的jar(会自动打包所有 build/libs 下的 jar)
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: build/**

      # 可选：上传构建日志
      - name: Upload build logs (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/**/logs/
